<!DOCTYPE html>
<html lang="de" class="h-full bg-slate-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Ferienhaus Laax – Interner Belegungsplan{% endblock %}</title>
    <!-- Google Fonts: Inter for clean functional UI -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- FullCalendar CSS and JS -->
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/locales/de.global.min.js"></script>
    
    <!-- Flatpickr CSS and JS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/de.js"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        .fc-event {
            cursor: pointer;
        }
        /* Custom scrollbar for calendar and lists */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body class="flex flex-col min-h-full font-sans text-slate-700 antialiased">

    <!-- Simple Functional Header -->
    <header class="bg-slate-800 text-white shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <div class="flex items-center space-x-3">
                    <i class="fa-solid fa-house-laptop text-amber-400 text-xl"></i>
                    <div>
                        <span class="font-bold tracking-tight text-white">Ferienhaus Laax</span>
                        <span class="hidden sm:inline text-slate-400 text-xs ml-2">| Via pendas 27, 7031 Laax</span>
                    </div>
                </div>
                <div class="text-xs text-slate-300 font-medium">
                    Interner Belegungsplan
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow">
        {% block content %}{% endblock %}
    </main>

    <!-- Simple Minimalist Footer -->
    <footer class="bg-slate-100 text-slate-500 border-t border-slate-200 py-6 text-center text-xs">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <p>Interner Belegungskalender zur Absprache für das Ferienhaus in Laax.</p>
        </div>
    </footer>

    {% block extra_js %}{% endblock %}
</body>
</html>
